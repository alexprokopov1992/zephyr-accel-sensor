description: STMicroelectronics LIS2DW12 3-axis accelerometer sensor

compatible: "fenix,lis2dw12-accel"

include: [sensor-device.yaml, spi-device.yaml]

properties:
  int-gpios:
    type: phandle-array
    required: true
    description: |
      GPIO connected to INT1 pin for data ready interrupt
      
  sampling-period-ms:
    type: int
    default: 1000
    description: |
      Sampling period in milliseconds for periodic measurements
